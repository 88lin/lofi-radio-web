<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Lofi Radio — browser-based focus music</title>
  <desc id="desc">A dark lofi radio interface with a floating player, live clock, vinyl record, and curated station metadata.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0912"/>
      <stop offset="0.55" stop-color="#120d19"/>
      <stop offset="1" stop-color="#071215"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b7cff"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="url(#grid)" stroke="#ffffff" stroke-opacity="0.1"/>
  <path d="M64 305H680" stroke="#ffffff" stroke-opacity="0.1"/>
  <path d="M64 305H278" stroke="url(#accent)" stroke-width="2"/>

  <g id="title-block" transform="translate(64 58)">
    <text x="0" y="0" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3">FOCUS MUSIC / WEB APP</text>
    <text x="0" y="84" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="78" font-weight="760" letter-spacing="-2">LOFI RADIO</text>
    <text x="2" y="130" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600">一台安静的浏览器电台</text>
    <text x="2" y="168" fill="#b9adbf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24">给学习、编程、阅读与入睡留出背景声音。</text>

    <g transform="translate(0 211)">
      <rect width="168" height="48" rx="24" fill="url(#button)"/>
      <circle cx="29" cy="24" r="11" fill="#ffffff" fill-opacity="0.18"/>
      <path d="M26 18L36 24L26 30Z" fill="#ffffff"/>
      <text x="51" y="31" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">打开即听</text>
    </g>
    <text x="0" y="303" fill="#9d91a7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">21 STATIONS  ·  PWA  ·  FOCUS TIMER</text>
  </g>

  <g id="player-proof" transform="translate(764 38)">
    <rect x="0" y="0" width="372" height="54" rx="27" fill="#17141d" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="15" y="11" width="32" height="32" rx="10" fill="url(#button)"/>
    <path d="M25 20V33M29 18V31M33 22V35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="60" y="34" fill="#f8f5fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">Lofi Radio</text>
    <rect x="193" y="13" width="146" height="28" rx="14" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="207" y="21" width="4" height="11" rx="2" fill="#f472b6"/>
    <rect x="215" y="18" width="4" height="14" rx="2" fill="#f472b6"/>
    <rect x="223" y="23" width="4" height="9" rx="2" fill="#f472b6"/>
    <text x="239" y="33" fill="#bcb3c1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">B3cks Radio</text>

    <rect x="38" y="76" width="296" height="64" rx="32" fill="#211a2d" stroke="#a78bfa" stroke-opacity="0.25"/>
    <circle cx="75" cy="108" r="20" fill="#3f3152"/>
    <circle cx="75" cy="108" r="8" fill="#f472b6"/>
    <path d="M75 91A17 17 0 0 1 92 108A17 17 0 0 1 75 125" fill="none" stroke="#f472b6" stroke-opacity="0.45" stroke-width="2"/>
    <text x="107" y="103" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">B3cks Radio</text>
    <circle cx="116" cy="122" r="4" fill="#fda4af"/>
    <text x="129" y="128" fill="#a99db0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">playing · 01:24</text>
    <rect x="272" y="91" width="44" height="34" rx="17" fill="#f472b6"/>
    <path d="M288 101V115M296 101V115" stroke="#24182c" stroke-width="3" stroke-linecap="round"/>

    <rect x="0" y="160" width="372" height="124" rx="24" fill="#10151a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="26" y="190" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">DEEP WORK / 23:05</text>
    <text x="26" y="242" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="50" font-weight="700">23:05</text>
    <text x="26" y="267" fill="#8e8493" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">Wed · Jul 29 · focus time 01:24</text>
    <g transform="translate(267 190)">
      <circle cx="43" cy="43" r="43" fill="#17131e" stroke="#f472b6" stroke-opacity="0.45" stroke-width="2"/>
      <circle cx="43" cy="43" r="29" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
      <circle cx="43" cy="43" r="5" fill="#f472b6"/>
      <path d="M43 43L58 31M43 43L43 21" stroke="#f6d5e5" stroke-width="3" stroke-linecap="round"/>
      <path d="M43 6V12M80 43H74M43 80V74M6 43H12" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <g id="footer-meta" transform="translate(764 342)">
    <circle cx="5" cy="-6" r="4" fill="#67e8f9"/>
    <text x="18" y="0" fill="#9db3b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">MP3 / HLS / FLV · local-first controls</text>
  </g>
</svg>
